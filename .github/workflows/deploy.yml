name: deploy
# MANUAL deploys only, same discipline as the rail/console: a routine merge
# never mutates production. Requires the CLOUDFLARE_API_TOKEN secret (Workers
# Scripts:Edit + the keyhalve.com zone) on this repo.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: smoke
        # A first-time custom-domain deploy can take >10s to provision the
        # certificate + route (the 2026-07-30 fresh-account deploy succeeded
        # but this step false-negatived on a single 10s wait). Retry instead.
        run: |
          for i in $(seq 1 6); do
            sleep 10
            if curl -sf https://mcp.keyhalve.com/health | grep -q '"ok":true' \
              && curl -sf -X POST https://mcp.keyhalve.com/mcp -H 'Content-Type: application/json' \
                -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q 'keyhalve_verify'; then
              echo "smoke passed on attempt $i"; exit 0
            fi
            echo "attempt $i failed; retrying"
          done
          echo "smoke failed after 6 attempts (60s)"; exit 1
